# Every morning: download the chains' price files, rebuild the app with the fresh data and
# publish it to GitHub Pages. Free on a public repository.
name: Sync prices and deploy

on:
  schedule:
    # 04:30 UTC is 06:30 or 07:30 in Israel, after the chains publish their nightly files.
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Several chains refuse connections from servers outside Israel. Their prices are fetched
      # on a computer in Israel (npm run deploy:israel) and kept as a file on a GitHub release.
      - name: Prices fetched from Israel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local-data
          if gh release download local-data --pattern local-data.tar --dir local-data; then
            tar -xf local-data/local-data.tar -C local-data
          else
            echo "No Israel-side data has been uploaded yet."
          fi
      # If too few stores come back, the job fails here and yesterday's site stays online.
      - run: npm run sync -- --min-stores 400 --fallback local-data/data
      - run: rm -rf local-data
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
