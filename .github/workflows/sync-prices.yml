# Every hour: download the chains' price files, rebuild the app with the fresh data and
# publish it to GitHub Pages. Free on a public repository; a run takes about five minutes.
#
# Three clocks start it:
# - The hourly job on Guy's Mac (scripts/hourly-israel.sh), right after it uploads the chains that
#   only answer from Israel. Always runs: it brings new data.
# - An outside timer (cron-job.org) at minute 47 of every hour, sending source=timer, for when
#   the Mac is asleep or off.
# - GitHub's own schedule, which is unreliable (runs are delayed or dropped for hours).
# The timer's and the schedule's runs step aside when a run already rebuilt the site in the last
# 45 minutes, so an awake Mac and the timer do not both rebuild every hour.
name: Sync prices and deploy

on:
  schedule:
    # Chains publish new full price files during the day as well as at night. Minute 17, not 0:
    # GitHub delays or drops scheduled runs at the top of the hour, when it is busiest.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Deploy even if a chain lost many stores (a first deploy, or a chain that really went away)
        type: boolean
        default: false
      source:
        description: Who asked for this run ("timer" for the outside hourly timer)
        type: string
        default: ''
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'android/**', 'store/**', 'ios/**', 'capacitor.config.ts']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A timer or scheduled run is not needed when a run rebuilt the site in the last 45 minutes.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.source }}" = "timer" ]; then
            since=$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            # Recent successful runs; a run that itself stepped aside does not count, only one whose
            # build job really ran.
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync-prices.yml --limit 8 \
              --json databaseId,createdAt,conclusion --jq ".[] | select(.createdAt >= \"$since\" and .conclusion == \"success\") | .databaseId"); do
              built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length' || echo 0)
              if [ "${built:-0}" -gt 0 ]; then skip=true; echo "Run $id rebuilt the site in the last 45 minutes; skipping."; break; fi
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Several chains refuse connections from servers outside Israel. Their prices are fetched
      # on a computer in Israel (npm run deploy:israel) and kept as a file on a GitHub release.
      - name: Prices fetched from Israel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local-data
          if gh release download local-data --pattern local-data.tar --dir local-data; then
            tar -xf local-data/local-data.tar -C local-data
          else
            echo "No Israel-side data has been uploaded yet."
          fi
      # Stores that did not come back this time keep their last prices: from the Israel-side
      # file or from the site as it is published now, whichever is newer. If too few stores come
      # back in total, a chain loses more than 30% of its stores (or all chains 20%) compared with
      # the published site, or neither the site nor the Israel-side file can be read, the job
      # fails here and the current site stays online.
      - run: >-
          npm run sync -- --min-stores 400 --fallback local-data/data
          --previous-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/"
          ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - run: rm -rf local-data
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
